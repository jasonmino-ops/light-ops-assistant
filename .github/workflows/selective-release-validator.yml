name: E-Shop selective release validator
on:
  push:
    branches: [codex/release-validator-control]
permissions:
  contents: read
  actions: read
concurrency: eshop-release-validator
jobs:
  validate:
    if: github.repository == 'jasonmino-ops/light-ops-assistant' && github.ref == 'refs/heads/codex/release-validator-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: eshop-release-validator
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact stale REPORT acknowledgement release and live trusted refs
        id: pos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          canonical=https://github.com/jasonmino-ops/light-ops-assistant.git
          case "$(git remote get-url origin)" in
            "$canonical"|"${canonical%.git}") git remote set-url origin "$canonical" ;;
            *) echo 'Unexpected checkout origin'; exit 1 ;;
          esac
          node .github/release-validator/print-device-takeover.mjs preflight
      - name: Publish once and verify the original App response ID
        env:
          ADMISSION_MAIN: ${{ steps.pos.outputs.main }}
          ADMISSION_DIGEST: ${{ steps.pos.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          ESHOP_RELEASE_VALIDATOR_PEM: ${{ secrets.ESHOP_RELEASE_VALIDATOR_PEM }}
        run: node .github/release-validator/print-device-takeover.mjs publish
