name: E-Shop selective release validator
on:
  push:
    branches: [codex/release-validator-control]
permissions:
  contents: read
concurrency: eshop-release-validator
jobs:
  validate:
    if: github.repository == 'jasonmino-ops/light-ops-assistant' && github.ref == 'refs/heads/codex/release-validator-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: eshop-release-validator
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact approved candidate and publish App result
        env:
          ESHOP_RELEASE_VALIDATOR_PEM: ${{ secrets.ESHOP_RELEASE_VALIDATOR_PEM }}
        run: node .github/release-validator/validate.mjs publish
