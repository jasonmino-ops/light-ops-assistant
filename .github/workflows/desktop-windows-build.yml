# E-Shop Desktop — Windows 构建链（Milestone A / A11）
#
# 在 windows-latest 上执行 Type Check、单元测试、Electron 编译与
# electron-builder NSIS 打包，并上传安装包构建物。
# 说明：安装包未做代码签名，首次安装可能出现 SmartScreen 提示（已知限制）。

name: desktop-windows-build

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "packages/hrt-contract/**"
      - "desktop/**"
      - ".github/workflows/desktop-windows-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Windows Provider artifact source
        uses: actions/checkout@v4
        with:
          repository: jasonmino-ops/eshop-windows-provider
          ref: c5cc86b35fa185aac795d0e141de549858b81f8b
          token: ${{ secrets.EP_MB3_PROVIDER_REPO_TOKEN }}
          path: ep-mb3-provider
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Contract dependencies
        run: npm ci
        working-directory: packages/hrt-contract

      - name: Build Contract
        run: npm run build
        working-directory: packages/hrt-contract

      - name: Install Desktop dependencies
        run: npm ci

      - name: Install Provider dependencies
        run: npm ci
        working-directory: ep-mb3-provider

      - name: Verify exact Provider commit
        shell: pwsh
        working-directory: ep-mb3-provider
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "c5cc86b35fa185aac795d0e141de549858b81f8b") {
            throw "Unexpected Provider commit: $actual"
          }

      - name: Provider tests
        run: npm test
        working-directory: ep-mb3-provider

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Compile main & preload
        run: npm run compile

      - name: Build Windows installer (NSIS, unsigned)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "release-windows.log"
          npm run release:windows *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content $log -Tail 80) -join "`n"
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows release build failed::$escaped"
            exit $LASTEXITCODE
          }
        env:
          ESHOP_PROVIDER_SOURCE: ${{ github.workspace }}\ep-mb3-provider

      - name: Verify staged Provider artifact
        shell: pwsh
        working-directory: .
        run: |
          $expectedProviderCommit = "c5cc86b35fa185aac795d0e141de549858b81f8b"
          $actualProviderCommit = git -C ep-mb3-provider rev-parse HEAD
          if ($actualProviderCommit -ne $expectedProviderCommit) {
            throw "Unexpected Provider commit after release build: $actualProviderCommit"
          }
          $staged = "desktop\build\provider\eshop-windows-provider"
          $required = @(
            "$staged\dist\index.js",
            "$staged\package.json",
            "$staged\provider-manifest.json",
            "$staged\helper\win-x64\eshop-print-helper.exe"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              throw "Staged Provider required file missing: $path"
            }
          }
          $metadata = "desktop\build\provider\provider-build-metadata.json"
          if (!(Test-Path $metadata)) {
            throw "Staged Provider build metadata missing: $metadata"
          }
          $metadataJson = Get-Content $metadata | ConvertFrom-Json
          if ($metadataJson.providerCommit -ne $expectedProviderCommit) {
            throw "Unexpected staged Provider metadata commit: $($metadataJson.providerCommit)"
          }

      - name: Provider supervision pipe integration
        shell: pwsh
        run: |
          $providerEntry = (Resolve-Path .\build\provider\eshop-windows-provider\dist\index.js).Path
          $env:ESHOP_WINDOWS_PROVIDER_ENTRY = $providerEntry
          node -e "const {WindowsProviderSupervisor}=require('./dist/main/provider/providerSupervisor'); const {getHealthSnapshot}=require('./dist/main/runtimeHealth'); (async()=>{const s=new WindowsProviderSupervisor({pipeSuffix:'ci-'+process.pid,connectDelayMs:500}); await s.start(); await new Promise(r=>setTimeout(r,1500)); const h=getHealthSnapshot().providerRuntime; console.log(JSON.stringify(h)); if(h.state!=='ok') throw new Error('Provider did not reach ok state'); await s.stop();})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Provider command.request real receipt dry-run
        shell: pwsh
        run: |
          $providerEntry = (Resolve-Path .\build\provider\eshop-windows-provider\dist\index.js).Path
          $env:ESHOP_WINDOWS_PROVIDER_ENTRY = $providerEntry
          node -e "const {WindowsProviderSupervisor}=require('./dist/main/provider/providerSupervisor'); (async()=>{const s=new WindowsProviderSupervisor({pipeSuffix:'cmd-'+process.pid,connectDelayMs:500}); await s.start(); await new Promise(r=>setTimeout(r,1500)); const result=await s.executeCommand({commandId:'ci-real-receipt',idempotencyKey:'ci-real-receipt',device:{deviceId:'receipt-printer',deviceKind:'PRINTER',slotId:'receipt-printer'},commandType:'PRINT_RECEIPT',params:{dryRun:true,receipt:{schemaVersion:'1',receiptId:'ci-real-receipt',saleId:'ci-sale-001',orderNumber:'CI-ORDER-001',storeName:'店小二 CI Store',storeCode:'CI',cashierName:'Windows CI',timestamp:'2026-07-16T00:00:00.000Z',currencyCode:'USD',items:[{name:'店小二 Windows 打印测试',quantity:1,unitPrice:12.34,lineTotal:12.34},{name:'តេស្តបោះពុម្ព Windows',quantity:1,unitPrice:1,lineTotal:1}],subtotal:13.34,total:13.34,paymentMethod:'CASH',footer:'Thank you',language:'mixed'}}}); console.log(JSON.stringify(result)); if(result.outcome!=='SUCCEEDED'||result.effectBoundary!=='CROSSED') throw new Error('command.request dry-run failed'); await s.stop();})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Electron runtime Provider smoke with spaces
        shell: pwsh
        run: |
          $spaceDir = Join-Path $env:RUNNER_TEMP "Provider Artifact With Spaces"
          New-Item -ItemType Directory -Force -Path $spaceDir | Out-Null
          Copy-Item -Recurse -Force .\build\provider\eshop-windows-provider $spaceDir\
          $providerEntry = Join-Path $spaceDir "eshop-windows-provider\dist\index.js"
          $electron = (Resolve-Path .\node_modules\electron\dist\electron.exe).Path
          $smokePath = Join-Path $env:RUNNER_TEMP "electron-provider-smoke.json"
          $env:ELECTRON_RUN_AS_NODE = "1"
          & $electron $providerEntry --smoke *> $smokePath
          $smokeText = Get-Content -Raw $smokePath
          Write-Output $smokeText
          if ($smokeText -notmatch '"ok"\s*:\s*true') { throw "Electron runtime Provider smoke failed" }
          Remove-Item Env:\ELECTRON_RUN_AS_NODE

      - name: Verify no surviving Provider process
        shell: pwsh
        working-directory: .
        run: |
          $orphans = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*eshop-windows-provider*dist*index.js*' }
          if ($orphans) {
            $orphans | Format-Table ProcessId,CommandLine -AutoSize
            throw "Surviving Provider process detected"
          }

      - name: Verify packaged Provider resource
        shell: pwsh
        run: |
          $resourceEntry = ".\release\win-unpacked\resources\eshop-windows-provider\dist\index.js"
          if (!(Test-Path $resourceEntry)) {
            throw "Packaged Provider resource missing: $resourceEntry"
          }
          $manifest = ".\release\win-unpacked\resources\eshop-windows-provider\provider-manifest.json"
          if (!(Test-Path $manifest)) {
            throw "Packaged Provider manifest missing: $manifest"
          }
          $helper = ".\release\win-unpacked\resources\eshop-windows-provider\helper\win-x64\eshop-print-helper.exe"
          if (!(Test-Path $helper)) {
            throw "Packaged print helper missing: $helper"
          }
          $buildManifest = ".\release\win-unpacked\resources\build-manifest.json"
          if (!(Test-Path $buildManifest)) {
            throw "Packaged build manifest missing: $buildManifest"
          }
          $installer = ".\release\E-Shop-Store-OS-Setup-1.0.0-x64.exe"
          if (!(Test-Path $installer)) {
            throw "Installer missing: $installer"
          }
          $sha = ".\release\SHA256SUMS.txt"
          if (!(Test-Path $sha)) {
            throw "SHA256SUMS missing: $sha"
          }

      - name: Verify installer artifacts
        run: npm run verify:installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: eshop-store-os-windows-installer
          path: |
            desktop/release/E-Shop-Store-OS-Setup-1.0.0-x64.exe
            desktop/release/*.blockmap
            desktop/release/SHA256SUMS.txt
            desktop/release/build-manifest.json
            desktop/release/artifact-list.json
          if-no-files-found: error
