# E-Shop Desktop — Windows 打包配置（Milestone A）
#
# 说明：
# - NSIS 安装包（非一键安装，允许用户选择安装目录）
# - 按用户安装（perMachine: false），无需管理员权限
# - 用户数据目录：%APPDATA%/eshop-desktop（config.json / logs / window-state.json）
# - Phase 1 只建立 GitHub Releases / update metadata 基础；
#   updater runtime、quitAndInstall 与商业签名 Gate 不在本阶段实现。
# - 未配置代码签名：本阶段只能生成 unsigned-internal pilot build，
#   不得标记为 signed-commercial 或 store pilot / commercial-ready。
# - 普通 CI 必须使用 --publish never；正式 Release 由受控 workflow 上传。

appId: com.eshop.desktop
productName: E-Shop Desktop
copyright: "Copyright © 2026 E-Shop (店小二)"

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json

extraResources:
  - from: ../../eshop-windows-provider/artifacts/eshop-windows-provider
    to: eshop-windows-provider
    filter:
      - dist/**
      - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "E-Shop-Desktop-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "E-Shop Desktop"
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: jasonmino-ops
  repo: light-ops-assistant
