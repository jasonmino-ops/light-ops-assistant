# E-Shop Certificate Manager 打包配置
#
# - portable：单个 exe，工程师拷到 U 盘即可用，现场不需要安装步骤
# - zip：不依赖 wine，可在非 Windows 机器上产出，用于交付真机验收
# - requestedExecutionLevel: requireAdministrator
#   写 C:\Program Files\QZ Tray\qz-tray.properties 必须提权；
#   启动时由 Windows 弹 UAC，人工确认，符合"不得静默安装 Root"的要求
# - 未配置代码签名：本阶段只能作为内部验收构建，不得作为对外发布版本

appId: com.eshop.certificate-manager
productName: E-Shop Certificate Manager
copyright: "Copyright © 2026 E-Shop (店小二)"

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json

extraResources:
  - from: certificate-package
    to: certificate-package
    filter:
      - "**/*"
      - "!README.md"
      - "!manifest.example.json"

win:
  requestedExecutionLevel: requireAdministrator
  target:
    - target: zip
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "E-Shop-Certificate-Manager-${version}-${arch}.${ext}"

portable:
  # 关键：portable 目标会生成一个 NSIS 自解压外壳，它有自己的 manifest。
  # 不设这一项时外壳是 asInvoker —— 双击不弹 UAC，内层 requireAdministrator 的
  # exe 无法通过 ExecWait 启动，现场表现为"点了没反应"。
  requestExecutionLevel: admin
  artifactName: "E-Shop-Certificate-Manager-${version}.${ext}"

publish: null
